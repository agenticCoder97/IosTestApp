worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    log_format astral '$remote_addr - $remote_user [$time_iso8601] '
                     '"$request" $status $body_bytes_sent '
                     'rt=$request_time urt="$upstream_response_time" '
                     '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log astral;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name astral-reader.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/astral-reader.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/astral-reader.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass http://fastapi:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        location /static/ {
            alias /mnt/astral-media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Docker internal DNS at 127.0.0.11 — resolver + variable-based
        # proxy_pass defers astral_monitor hostname resolution to request
        # time instead of nginx startup. Prevents hard crash-loop if the
        # monitor container isn't up yet when nginx reloads.
        resolver 127.0.0.11 valid=10s ipv6=off;

        location = /monitor { return 301 /monitor/; }
        location /monitor/ {
            auth_basic "astral";
            auth_basic_user_file /etc/nginx/htpasswd;
            set $monitor_upstream http://astral_monitor:8001;
            proxy_pass $monitor_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30;
        }

        location /metrics {
            auth_basic "astral";
            auth_basic_user_file /etc/nginx/htpasswd;
            set $metrics_upstream http://astral_monitor:8001;
            proxy_pass $metrics_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30;
        }

        # Internal-only nginx runtime stats for the monitor service.
        # compose network 172.19.0.0/16 — no auth_basic, relying on
        # network isolation (deny all for anyone outside the subnet).
        location = /nginx_status {
            stub_status;
            allow 172.19.0.0/16;
            deny all;
            access_log off;
        }
    }
}
