services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - astral_net

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - astral_net

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - .env.oci
    volumes:
      - astral_media:/mnt/astral-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - astral_net

  arq_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.oci
    volumes:
      - astral_media:/mnt/astral-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - astral_net

  astral_monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
      args:
        # Pass the current git SHA so the image reports its build via
        # /metrics. Deploy script should export MONITOR_BUILD_SHA=$(git
        # rev-parse --short HEAD); if unset it falls back to "unknown".
        MONITOR_BUILD_SHA: ${MONITOR_BUILD_SHA:-unknown}
    expose:
      - "8001"
    env_file:
      - .env.oci
    # Add supplementary group so the monitor (uid 1001) can read /var/run/docker.sock
    # which is root:docker 0660 on the A1 host. DOCKER_GID is set in .env.oci.
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      # read-write so /control/* endpoints can restart containers
      # (AST-71) and exec pg_dump (AST-74). All mutating routes are
      # gated behind MONITOR_CONTROL_TOKEN.
      - /var/run/docker.sock:/var/run/docker.sock
      - letsencrypt:/etc/letsencrypt:ro
      - astral_media:/mnt/astral-media:ro
      - nginx_access_logs:/var/log/nginx:ro
      # persistent state for audit log, on-demand pg_dump output,
      # and the deploy hook's deploys.jsonl.
      - monitor_state:/var/lib/astral-monitor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - astral_net

  nginx:
    image: nginx:1.25-alpine
    command:
      - sh
      - -c
      - "rm -f /var/log/nginx/access.log /var/log/nginx/error.log && exec nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - letsencrypt:/etc/letsencrypt:ro
      - astral_media:/mnt/astral-media:ro
      - nginx_access_logs:/var/log/nginx
    depends_on:
      - fastapi
      - astral_monitor
    restart: unless-stopped
    networks:
      - astral_net

  certbot:
    # community-maintained image bundling certbot + certbot-dns-duckdns plugin;
    # the previously-referenced certbot/dns-duckdns doesn't exist on Docker Hub.
    image: infinityofspace/certbot_dns_duckdns:latest
    env_file:
      - .env.oci
    volumes:
      - letsencrypt:/etc/letsencrypt
    # Renew every 12h; LE renews when <30d remaining
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 43200 & wait $${!}; done'"
    restart: unless-stopped

volumes:
  astral_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/astral-media
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/astral-media/postgres
  letsencrypt:
  nginx_access_logs:
  monitor_state:

networks:
  astral_net:
    driver: bridge
    # Pin the bridge subnet so nginx's `allow 172.19.0.0/16` for the
    # stub_status location always matches the monitor container's IP.
    # Docker bridge networks otherwise get whatever /16 is free, which
    # could be 172.20.x.x on a re-provision and would silently deny the
    # monitor scrape.
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/16
