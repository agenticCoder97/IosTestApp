services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - astral_net

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - astral_net

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - .env.oci
    volumes:
      - astral_media:/mnt/astral-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - astral_net

  arq_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.oci
    volumes:
      - astral_media:/mnt/astral-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - astral_net

  astral_monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    expose:
      - "8001"
    env_file:
      - .env.oci
    # Add supplementary group so the monitor (uid 1001) can read /var/run/docker.sock
    # which is root:docker 0660 on the A1 host. DOCKER_GID is set in .env.oci.
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/etc/letsencrypt:ro
      - astral_media:/mnt/astral-media:ro
      - nginx_access_logs:/var/log/nginx:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - astral_net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - letsencrypt:/etc/letsencrypt:ro
      - astral_media:/mnt/astral-media:ro
      - nginx_access_logs:/var/log/nginx
    depends_on:
      - fastapi
      - astral_monitor
    restart: unless-stopped
    networks:
      - astral_net

  certbot:
    # community-maintained image bundling certbot + certbot-dns-duckdns plugin;
    # the previously-referenced certbot/dns-duckdns doesn't exist on Docker Hub.
    image: infinityofspace/certbot_dns_duckdns:latest
    env_file:
      - .env.oci
    volumes:
      - letsencrypt:/etc/letsencrypt
    # Renew every 12h; LE renews when <30d remaining
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 43200 & wait $${!}; done'"
    restart: unless-stopped

volumes:
  astral_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/astral-media
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/astral-media/postgres
  letsencrypt:
  nginx_access_logs:

networks:
  astral_net:
    driver: bridge
