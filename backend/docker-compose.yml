services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - astral_net

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - astral_net

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - .env.oci
    volumes:
      - astral_media:/mnt/astral-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - astral_net

  arq_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.oci
    volumes:
      - astral_media:/mnt/astral-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - astral_net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - astral_media:/mnt/astral-media:ro
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - astral_net

  certbot:
    image: certbot/dns-duckdns:latest
    env_file:
      - .env.oci
    volumes:
      - letsencrypt:/etc/letsencrypt
    # Renew every 12h; LE renews when <30d remaining
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 43200 & wait $${!}; done'"
    restart: unless-stopped

volumes:
  astral_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/astral-media
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/astral-media/postgres
  letsencrypt:

networks:
  astral_net:
    driver: bridge
