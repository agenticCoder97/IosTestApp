name: Astral
options:
  bundleIdPrefix: com.astral
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  Core:
    path: Packages/Core
  Networking:
    path: Packages/Networking
  DesignSystem:
    path: Packages/DesignSystem
  ComicFeature:
    path: Packages/ComicFeature
  FanficFeature:
    path: Packages/FanficFeature

targets:
  Astral:
    type: application
    platform: iOS
    sources:
      - path: AstralApp.swift
      - path: App
      - path: Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.astral.reader
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    dependencies:
      - package: Core
      - package: Networking
      - package: DesignSystem
      - package: ComicFeature
      - package: FanficFeature
