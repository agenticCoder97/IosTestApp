name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ─── PR Review: triggered by @ccreview in PR comments ───
  pr-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@ccreview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR thoroughly. Check for:
            - Code correctness and logic errors
            - SwiftUI/SwiftData best practices (iOS 17.2+ target)
            - MVVM architecture compliance
            - Design system token usage (no hardcoded hex)
            - Async/await patterns (no completion handlers)
            - Security vulnerabilities
            - Performance implications
            - Follow the CLAUDE.md guidelines in the repo root
            Post findings as specific, actionable review comments on the diff.
          claude_args: "--max-turns 5"

  # ─── Issue Implementation: triggered by @ccimplement in issue comments ───
  issue-implement:
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@ccimplement')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read the issue description and comments carefully.
            Plan the implementation, write the code, create a new branch,
            commit with the [ios] or [backend] prefix convention, push,
            and create a PR to the development branch.
            Follow the CLAUDE.md guidelines in the repo root.
          claude_args: "--max-turns 15"
