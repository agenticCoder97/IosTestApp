name: iOS Tests

on:
  pull_request:
    branches: [development, production, main]
    paths:
      - 'ios/**'

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/Astral
        run: xcodegen generate

      - name: Run unit tests
        working-directory: ios/Astral
        run: |
          xcodebuild test \
            -scheme Astral \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -only-testing:CoreTests \
            -only-testing:NetworkingTests \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    name: UI Tests
    runs-on: macos-15
    timeout-minutes: 30
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/Astral
        run: xcodegen generate

      - name: Build for testing
        working-directory: ios/Astral
        run: |
          xcodebuild build-for-testing \
            -scheme Astral \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests
        working-directory: ios/Astral
        run: |
          xcodebuild test-without-building \
            -scheme AstralUITests \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios/Astral/TestResults.xcresult
          retention-days: 14
